apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute
spec:
  parentRefs:
    - name: public-gateway
      namespace: networking

  hostnames:
    - hosting.toando.de

  rules:
    - backendRefs:
        - name: {{ .Release.Name }}-service
          port: 3000